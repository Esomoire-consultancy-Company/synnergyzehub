name: Seed Node CI

on:
  push:
    branches: [ main ]
    paths:
      - "seed-node-v0.1/**"
      - ".github/workflows/seed-node-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "seed-node-v0.1/**"
      - ".github/workflows/seed-node-ci.yml"

permissions:
  contents: read

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check files
        run: |
          test -f seed-node-v0.1/README.md
          test -f seed-node-v0.1/packages/database/init.sql
          test -f seed-node-v0.1/packages/riveros/schema.sql
          test -f seed-node-v0.1/packages/database/gmt_onboarding.sql
          test -f seed-node-v0.1/apps/api/app/main.py
          test -f seed-node-v0.1/apps/api/app/gmt.py
          test -f seed-node-v0.1/apps/api/tests/test_gmt_contract.py

      - name: Validate Docker Compose file exists
        run: |
          test -f seed-node-v0.1/infra/docker-compose.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r seed-node-v0.1/apps/api/requirements.txt

      - name: Compile API
        run: |
          python -m compileall -q seed-node-v0.1/apps/api/app

      - name: Run Grow My Trade contract tests
        env:
          DATABASE_URL: ******localhost:5432/synnergyze_seed
          PYTHONPATH: seed-node-v0.1/apps/api
        run: |
          python -m unittest discover -s seed-node-v0.1/apps/api/tests -p "test_*.py"
